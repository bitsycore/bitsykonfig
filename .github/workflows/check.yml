name: Check

on:
  pull_request:
  push:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - java: '17'
            kotlin: '2.3.0'
            agp: '8.13.2'
          - java: '25'
            kotlin: '2.4.0'
            agp: '9.3.2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          # The default also installs the legacy 'tools' package, gone from cmdline-tools 16.
          packages: platform-tools
      - name: Install Android test SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'build-tools;36.0.0'
      - name: Check and compile consumer projects
        run: >-
          ./gradlew check
          -Pkonfig.test.kotlinVersion=${{ matrix.kotlin }}
          -Pkonfig.test.androidVersion=${{ matrix.agp }}
          --stacktrace
